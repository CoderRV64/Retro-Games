<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#050505">
    <meta
        name="description"
        content="Retro Games - Juegos retro propios"
    >

    <title>Retro Games</title>

    <style>

        :root {
            --black: #050505;
            --black-soft: #0a0a0a;
            --green: #00ff66;
            --green-dark: #008f3d;
            --blue: #008cff;
            --blue-dark: #00529b;
            --white: #eafff2;
            --gray: #789184;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: var(--black);
            color: var(--white);
            font-family: monospace;
        }

        /*
         * Fondo con una pequeña cuadrícula
         * para darle aspecto retro.
         */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(0, 255, 102, 0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 140, 255, 0.025) 1px,
                    transparent 1px
                );

            background-size: 32px 32px;
        }

        .app {
            position: relative;

            width: min(1100px, 100%);
            min-height: 100vh;

            margin: 0 auto;
            padding: 24px 16px 40px;
        }

        /*
         * Cabecera
         */

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            margin: 0;

            color: var(--green);

            font-size: clamp(
                2.2rem,
                9vw,
                4.5rem
            );

            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;

            text-shadow:
                0 0 8px rgba(0, 255, 102, 0.5),
                0 0 20px rgba(0, 255, 102, 0.2);
        }

        /*
         * Línea decorativa
         */

        .header-line {
            width: min(500px, 80%);
            height: 3px;

            margin: 15px auto 0;

            background: linear-gradient(
                90deg,
                var(--green),
                var(--blue)
            );

            box-shadow:
                0 0 8px rgba(0, 255, 102, 0.4),
                0 0 8px rgba(0, 140, 255, 0.4);
        }

        /*
         * Lista de juegos
         */

        #games {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(230px, 1fr)
                );

            gap: 20px;
        }

        /*
         * Tarjeta
         */

        .game-card {
            position: relative;

            display: flex;
            flex-direction: column;

            min-height: 250px;

            padding: 20px;

            background: var(--black-soft);

            border: 2px solid var(--green-dark);

            border-radius: 8px;

            box-shadow:
                0 0 12px rgba(0, 255, 102, 0.08);

            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .game-card:hover {
            transform: translateY(-5px);

            border-color: var(--green);

            box-shadow:
                0 0 20px rgba(0, 255, 102, 0.2);
        }

        /*
         * Esquina decorativa
         */

        .game-card::before {
            content: "";

            position: absolute;

            top: -2px;
            right: -2px;

            width: 35px;
            height: 35px;

            border-top: 3px solid var(--blue);
            border-right: 3px solid var(--blue);
        }

        /*
         * Icono
         */

        .game-icon {
            display: grid;
            place-items: center;

            width: 72px;
            height: 72px;

            margin-bottom: 18px;

            background: #000;

            border: 2px solid var(--blue-dark);

            border-radius: 6px;

            color: var(--blue);

            font-size: 2rem;

            box-shadow:
                inset 0 0 12px rgba(0, 140, 255, 0.1);
        }

        /*
         * Nombre
         */

        .game-name {
            margin: 0 0 10px;

            color: var(--green);

            font-size: 1.4rem;

            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /*
         * Descripción
         */

        .game-description {
            flex: 1;

            margin: 0 0 20px;

            color: var(--gray);

            line-height: 1.5;
        }

        /*
         * Botón jugar
         */

        .play-button {
            display: block;

            width: 100%;

            padding: 14px;

            background: transparent;

            border: 2px solid var(--blue);

            border-radius: 5px;

            color: var(--blue);

            text-align: center;
            text-decoration: none;

            font-weight: 900;

            text-transform: uppercase;
            letter-spacing: 2px;

            transition:
                background 0.15s ease,
                color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .play-button:hover {
            background: var(--blue);

            color: #000;

            box-shadow:
                0 0 15px rgba(0, 140, 255, 0.4);
        }

        .play-button:active {
            transform: scale(0.98);
        }

        /*
         * Error
         */

        .error {
            grid-column: 1 / -1;

            padding: 20px;

            background: #090909;

            border: 2px solid var(--blue-dark);

            border-radius: 6px;

            color: var(--blue);

            text-align: center;
        }

        .error strong {
            color: var(--green);
        }

        /*
         * Footer
         */

        footer {
            margin-top: 45px;

            color: #3e5549;

            text-align: center;

            font-size: 0.8rem;
        }

        /*
         * Móvil
         */

        @media (max-width: 500px) {

            .app {
                padding:
                    20px
                    12px
                    30px;
            }

            header {
                margin-bottom: 28px;
            }

            .logo {
                letter-spacing: 3px;
            }

            #games {
                grid-template-columns: 1fr;
            }

            .game-card {
                min-height: 220px;
            }
        }

    </style>
</head>

<body>

<div class="app">

    <header>

        <h1 class="logo">
            Retro Games
        </h1>

        <div class="header-line"></div>

    </header>


    <main>

        <section
            id="games"
            aria-label="Lista de juegos"
        >

            <p>
                Cargando juegos...
            </p>

        </section>

    </main>


    <footer>

        RETRO GAMES

    </footer>

</div>


<script>

    /*
     * URL del catálogo.
     *
     * Se utiliza raw.githubusercontent.com para evitar
     * problemas al cargar Games.yaml desde GitHub Pages.
     */

    const GAMES_URL =
        "https://raw.githubusercontent.com/" +
        "CoderRV64/Retro-Games/main/Games.yaml";


    async function loadGames() {

        const container =
            document.getElementById("games");


        try {

            const response =
                await fetch(
                    GAMES_URL,
                    {
                        cache: "no-cache"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " + response.status
                );

            }


            const yaml =
                await response.text();


            const games =
                parseGamesYaml(yaml);


            if (games.length === 0) {

                throw new Error(
                    "No hay juegos en Games.yaml"
                );

            }


            container.innerHTML = "";


            games.forEach(game => {

                const card =
                    document.createElement("article");


                card.className =
                    "game-card";


                card.innerHTML = `

                    <div class="game-icon">
                        🎮
                    </div>

                    <h2 class="game-name">
                        ${escapeHTML(game.name)}
                    </h2>

                    <p class="game-description">
                        ${escapeHTML(
                            game.description ||
                            "Un juego retro propio."
                        )}
                    </p>

                    <a
                        class="play-button"
                        href="${escapeAttribute(game.url)}"
                    >
                        Jugar
                    </a>

                `;


                container.appendChild(card);

            });


        } catch (error) {

            console.error(
                "Retro Games:",
                error
            );


            container.innerHTML = `

                <div class="error">

                    <strong>
                        No se pudo cargar la lista de juegos.
                    </strong>

                    <p>
                        Comprueba que Games.yaml
                        exista en la rama main.
                    </p>

                </div>

            `;

        }

    }


    /*
     * Parser sencillo de Games.yaml.
     */

    function parseGamesYaml(yaml) {

        const games = [];

        let currentGame = null;


        const lines =
            yaml.split(/\r?\n/);


        for (const line of lines) {

            const trimmed =
                line.trim();


            if (
                !trimmed ||
                trimmed.startsWith("#") ||
                trimmed === "games:"
            ) {
                continue;
            }


            if (
                trimmed.startsWith("- id:")
            ) {

                if (currentGame) {

                    games.push(
                        currentGame
                    );

                }


                currentGame = {

                    id:
                        getValue(trimmed),

                    name: "",

                    url: "",

                    description: ""

                };


                continue;

            }


            if (!currentGame) {
                continue;
            }


            if (
                trimmed.startsWith("name:")
            ) {

                currentGame.name =
                    getValue(trimmed);

            }


            else if (
                trimmed.startsWith("url:")
            ) {

                currentGame.url =
                    getValue(trimmed);

            }


            else if (
                trimmed.startsWith("description:")
            ) {

                currentGame.description =
                    getValue(trimmed);

            }

        }


        if (currentGame) {

            games.push(
                currentGame
            );

        }


        return games.filter(
            game =>
                game.id &&
                game.name &&
                game.url
        );

    }


    function getValue(line) {

        let value =
            line
                .substring(
                    line.indexOf(":") + 1
                )
                .trim();


        if (

            (
                value.startsWith('"') &&
                value.endsWith('"')
            )

            ||

            (
                value.startsWith("'") &&
                value.endsWith("'")
            )

        ) {

            value =
                value.substring(
                    1,
                    value.length - 1
                );

        }


        return value;

    }


    function escapeHTML(value) {

        return String(value)

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );

    }


    function escapeAttribute(value) {

        return String(value)

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            );

    }


    /*
     * Iniciar catálogo.
     */

    loadGames();

</script>

</body>
</html>
