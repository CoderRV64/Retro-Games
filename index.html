<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda de Apps Descentralizada</title>
  
  <!-- Parser YAML -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --pwa-badge: #a855f7;
      --apk-badge: #10b981;
      --fdroid-badge: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--text);
      margin-bottom: 8px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    @media(min-width: 640px) {
      .controls {
        flex-direction: row;
      }
    }

    input[type="text"], select {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: var(--card-bg);
      color: var(--text);
      outline: none;
      font-size: 1rem;
    }

    input[type="text"] {
      flex: 1;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .app-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #334155;
      transition: transform 0.2s;
    }

    .app-card:hover {
      transform: translateY(-2px);
    }

    .app-header {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .app-icon {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      object-fit: cover;
      background-color: #334155;
    }

    .app-info {
      flex: 1;
      overflow: hidden;
    }

    .app-title {
      font-size: 1.1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-category {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .app-description {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .badge-DIRECT_APK { background-color: var(--apk-badge); color: #000; }
    .badge-IZZY_FDROID { background-color: var(--fdroid-badge); color: #000; }
    .badge-PWA { background-color: var(--pwa-badge); color: #fff; }

    .btn-action {
      background-color: var(--accent);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      font-size: 0.9rem;
    }

    .btn-action:hover {
      opacity: 0.9;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.2rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>app mix</h1>
    <p style="color: var(--text-muted);">Apps nativas y WebApps sin intermediarios</p>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Buscar aplicaciones..." />
    <select id="categoryFilter">
      <option value="ALL">Todas las Categorías</option>
    </select>
  </div>

  <div id="loading" class="loading">Cargando catálogo...</div>
  <div id="appGrid" class="app-grid"></div>

  <script>
    let rawAppsList = [];
    const defaultIcon = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56' viewBox='0 0 56 56'><rect width='56' height='56' rx='12' fill='%23334155'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='%23f8fafc' font-size='20' font-family='sans-serif'>App</text></svg>";

    const isNativeApp = () => {
      return typeof window.Capacitor !== 'undefined' && window.Capacitor.isNativePlatform();
    };

    // Descarga directa del YAML en GitHub Pages
    async function loadCatalog() {
      try {
        const response = await fetch('./apps.yaml');
        if (!response.ok) {
          throw new Error('No se pudo obtener el archivo apps.yaml');
        }
        const yamlText = await response.text();

        rawAppsList = jsyaml.load(yamlText) || [];
        
        document.getElementById('loading').style.display = 'none';
        populateCategories();
        renderApps(rawAppsList);
      } catch (error) {
        console.error("Error cargando el catálogo:", error);
        document.getElementById('loading').innerText = "Error cargando el catálogo de aplicaciones.";
      }
    }

    function populateCategories() {
      const categories = [...new Set(rawAppsList.map(app => app.category).filter(Boolean))];
      const select = document.getElementById('categoryFilter');
      select.innerHTML = '<option value="ALL">Todas las Categorías</option>';

      categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.innerText = cat;
        select.appendChild(option);
      });
    }

    function renderApps(apps) {
      const grid = document.getElementById('appGrid');
      grid.innerHTML = '';

      if (!apps || apps.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">No se encontraron aplicaciones.</p>';
        return;
      }

      apps.forEach(app => {
        const card = document.createElement('div');
        card.className = 'app-card';

        let badgeLabel = 'APK Directo';
        if (app.installType === 'IZZY_FDROID') badgeLabel = 'F-Droid/Izzy';
        if (app.installType === 'PWA') badgeLabel = 'Web / PWA';

        let buttonText = 'Instalar';
        if (app.installType === 'PWA') {
          buttonText = 'Abrir Web';
        } else if (!isNativeApp()) {
          buttonText = 'Descargar';
        }

        const iconSrc = app.iconUrl || defaultIcon;

        card.innerHTML = `
          <div>
            <div class="app-header">
              <img class="app-icon" src="${iconSrc}" alt="${app.name}" onerror="this.onerror=null; this.src='${defaultIcon}';" />
              <div class="app-info">
                <div class="app-title">${app.name || 'Sin título'}</div>
                <div class="app-category">${app.category || 'General'}</div>
              </div>
            </div>
            <p class="app-description">${app.description || 'Sin descripción disponible.'}</p>
          </div>
          
          <div class="card-footer">
            <span class="badge badge-${app.installType}">${badgeLabel}</span>
            <button class="btn-action" data-id="${app.id}">${buttonText}</button>
          </div>
        `;

        const btn = card.querySelector('.btn-action');
        btn.addEventListener('click', () => handleInstall(app.id));

        grid.appendChild(card);
      });
    }

    function handleInstall(appId) {
      const app = rawAppsList.find(a => a.id === appId);
      if (!app) return;

      if (app.installType === 'PWA') {
        window.open(app.url, '_blank');
        return;
      }

      let downloadTargetUrl = app.installType === 'IZZY_FDROID' ? app.repoUrl : app.url;

      if (isNativeApp()) {
        if (window.Capacitor.Plugins && window.Capacitor.Plugins.NativeInstaller) {
          window.Capacitor.Plugins.NativeInstaller.downloadAndInstall({ url: downloadTargetUrl, packageName: app.package });
        } else {
          alert("Llamando al instalador nativo para: " + app.name);
        }
      } else {
        window.location.href = downloadTargetUrl;
      }
    }

    function filterApps() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedCategory = document.getElementById('categoryFilter').value;

      const filtered = rawAppsList.filter(app => {
        const matchesSearch = (app.name && app.name.toLowerCase().includes(search)) || 
                              (app.description && app.description.toLowerCase().includes(search));
        const matchesCategory = selectedCategory === 'ALL' || app.category === selectedCategory;
        
        return matchesSearch && matchesCategory;
      });

      renderApps(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', filterApps);
    document.getElementById('categoryFilter').addEventListener('change', filterApps);

    window.addEventListener('DOMContentLoaded', loadCatalog);
  </script>
</body>
</html>
