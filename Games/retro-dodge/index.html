<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#111111">

    <title>Retro Dodge</title>

    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            color: #fff;
            font-family: monospace;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game {
            width: min(900px, 100vw);
            height: min(700px, 100vh);
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px;
            background: #181818;
            border-bottom: 2px solid #333;
        }

        .title {
            font-weight: bold;
        }

        .score {
            font-weight: bold;
        }

        .back {
            color: #fff;
            text-decoration: none;
            padding: 6px 10px;
            border: 1px solid #555;
            border-radius: 5px;
        }

        canvas {
            display: block;
            width: 100%;
            flex: 1;
            min-height: 0;
            background: #050505;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            justify-content: center;
            gap: 8px;
            padding: 10px;
            background: #181818;
        }

        .control {
            width: 70px;
            height: 55px;
            border: 2px solid #555;
            border-radius: 8px;
            background: #222;
            color: #fff;
            font-size: 1.4rem;
            font-family: monospace;
            user-select: none;
        }

        .control:active {
            background: #444;
        }

        .empty {
            visibility: hidden;
        }

        .message {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            display: none;

            padding: 25px;
            min-width: 240px;

            text-align: center;

            background: #111;
            border: 2px solid #fff;
            border-radius: 10px;
        }

        .message h1 {
            margin: 0 0 10px;
            font-size: 1.6rem;
        }

        .message button {
            padding: 10px 18px;
            border: 0;
            border-radius: 6px;
            background: #fff;
            color: #111;
            font-weight: bold;
            font-family: monospace;
        }

        @media (min-width: 700px) {
            .controls {
                display: none;
            }
        }

        @media (max-height: 500px) {
            .controls {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="game">

    <div class="topbar">

        <a class="back" href="../../index.html">
            ← Menú
        </a>

        <div class="title">
            RETRO DODGE
        </div>

        <div class="score">
            Puntos: <span id="score">0</span>
        </div>

    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">

        <button class="control empty"></button>

        <button
            class="control"
            data-key="ArrowUp"
        >
            ▲
        </button>

        <button class="control empty"></button>

        <button
            class="control"
            data-key="ArrowLeft"
        >
            ◀
        </button>

        <button
            class="control"
            data-key="ArrowDown"
        >
            ▼
        </button>

        <button
            class="control"
            data-key="ArrowRight"
        >
            ▶
        </button>

    </div>

</div>

<div id="message" class="message">

    <h1>GAME OVER</h1>

    <p>
        Puntuación:
        <strong id="finalScore">0</strong>
    </p>

    <button id="restart">
        Jugar de nuevo
    </button>

</div>


<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const message = document.getElementById("message");
const finalScore = document.getElementById("finalScore");
const restartButton = document.getElementById("restart");


let width = 0;
let height = 0;

let player;
let coin;
let enemies;

let score = 0;
let gameOver = false;

let keys = {};


/*
 * Ajustar el canvas al tamaño disponible.
 */
function resizeCanvas() {

    const rect = canvas.getBoundingClientRect();

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = rect.width;
    height = rect.height;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}


/*
 * Crear jugador.
 */
function createPlayer() {

    return {
        x: width / 2 - 15,
        y: height / 2 - 15,
        size: 30,
        speed: 4
    };
}


/*
 * Crear moneda.
 */
function createCoin() {

    return {
        x: 30 + Math.random() * (width - 60),
        y: 30 + Math.random() * (height - 60),
        size: 14
    };
}


/*
 * Crear enemigo.
 */
function createEnemy() {

    const size = 25;

    return {
        x: Math.random() * (width - size),
        y: Math.random() * (height - size),
        size: size,
        speedX: (Math.random() - 0.5) * 3,
        speedY: (Math.random() - 0.5) * 3
    };
}


/*
 * Iniciar/reiniciar partida.
 */
function startGame() {

    score = 0;
    gameOver = false;

    scoreElement.textContent = score;

    message.style.display = "none";

    player = createPlayer();

    coin = createCoin();

    enemies = [
        createEnemy(),
        createEnemy()
    ];
}


/*
 * Distancia/colisión entre dos cuadrados.
 */
function collision(a, b) {

    return (
        a.x < b.x + b.size &&
        a.x + a.size > b.x &&
        a.y < b.y + b.size &&
        a.y + a.size > b.y
    );
}


/*
 * Actualizar juego.
 */
function update() {

    if (gameOver) {
        return;
    }


    /*
     * Movimiento del jugador.
     */

    if (keys["ArrowUp"] || keys["w"] || keys["W"]) {
        player.y -= player.speed;
    }

    if (keys["ArrowDown"] || keys["s"] || keys["S"]) {
        player.y += player.speed;
    }

    if (keys["ArrowLeft"] || keys["a"] || keys["A"]) {
        player.x -= player.speed;
    }

    if (keys["ArrowRight"] || keys["d"] || keys["D"]) {
        player.x += player.speed;
    }


    /*
     * Limitar jugador al escenario.
     */

    player.x = Math.max(
        0,
        Math.min(width - player.size, player.x)
    );

    player.y = Math.max(
        0,
        Math.min(height - player.size, player.y)
    );


    /*
     * Comprobar moneda.
     */

    if (collision(player, coin)) {

        score++;

        scoreElement.textContent = score;

        coin = createCoin();

        /*
         * Cada 5 monedas aparece un enemigo.
         */

        if (score % 5 === 0) {
            enemies.push(createEnemy());
        }
    }


    /*
     * Mover enemigos.
     */

    for (const enemy of enemies) {

        enemy.x += enemy.speedX;
        enemy.y += enemy.speedY;

        if (
            enemy.x <= 0 ||
            enemy.x + enemy.size >= width
        ) {
            enemy.speedX *= -1;
        }

        if (
            enemy.y <= 0 ||
            enemy.y + enemy.size >= height
        ) {
            enemy.speedY *= -1;
        }


        /*
         * Colisión con jugador.
         */

        if (collision(player, enemy)) {
            endGame();
        }
    }
}


/*
 * Dibujar juego.
 */
function draw() {

    /*
     * Fondo.
     */

    ctx.fillStyle = "#050505";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
     * Cuadrícula retro.
     */

    ctx.strokeStyle = "#151515";
    ctx.lineWidth = 1;

    const gridSize = 32;

    for (let x = 0; x < width; x += gridSize) {

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
    }

    for (let y = 0; y < height; y += gridSize) {

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
    }


    /*
     * Moneda.
     */

    ctx.fillStyle = "#fff";

    ctx.fillRect(
        coin.x,
        coin.y,
        coin.size,
        coin.size
    );


    /*
     * Jugador.
     */

    ctx.fillStyle = "#fff";

    ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
    );

    ctx.fillStyle = "#050505";

    ctx.fillRect(
        player.x + 7,
        player.y + 7,
        5,
        5
    );

    ctx.fillRect(
        player.x + 18,
        player.y + 7,
        5,
        5
    );


    /*
     * Enemigos.
     */

    ctx.fillStyle = "#777";

    for (const enemy of enemies) {

        ctx.fillRect(
            enemy.x,
            enemy.y,
            enemy.size,
            enemy.size
        );
    }
}


/*
 * Game over.
 */
function endGame() {

    gameOver = true;

    finalScore.textContent = score;

    message.style.display = "block";
}


/*
 * Bucle principal.
 */
function gameLoop() {

    update();

    draw();

    requestAnimationFrame(gameLoop);
}


/*
 * Teclado.
 */
window.addEventListener("keydown", event => {

    keys[event.key] = true;

    if (
        [
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight"
        ].includes(event.key)
    ) {
        event.preventDefault();
    }
});


window.addEventListener("keyup", event => {

    keys[event.key] = false;
});


/*
 * Controles táctiles.
 */
document.querySelectorAll(".control").forEach(button => {

    const key = button.dataset.key;

    if (!key) {
        return;
    }


    function press(event) {

        event.preventDefault();

        keys[key] = true;
    }


    function release(event) {

        event.preventDefault();

        keys[key] = false;
    }


    button.addEventListener("touchstart", press, {
        passive: false
    });

    button.addEventListener("touchend", release, {
        passive: false
    });

    button.addEventListener("touchcancel", release, {
        passive: false
    });


    /*
     * También permite probar los controles
     * con ratón en ordenador.
     */

    button.addEventListener("mousedown", press);

    button.addEventListener("mouseup", release);

    button.addEventListener("mouseleave", release);
});


/*
 * Reiniciar.
 */
restartButton.addEventListener("click", startGame);


/*
 * Redimensionar.
 */
window.addEventListener("resize", () => {

    resizeCanvas();

    if (!gameOver) {
        player.x = Math.min(
            player.x,
            width - player.size
        );

        player.y = Math.min(
            player.y,
            height - player.size
        );
    }
});


/*
 * Arranque.
 */
resizeCanvas();

startGame();

gameLoop();

</script>

</body>
  </html>
